services:
  dbx:
    image: t8y2/dbx:latest
    # For faster pulls in China, use the CNB image instead:
    # image: docker.cnb.cool/dbxio.com/dbx:latest
    pull_policy: always
    ports:
      - "4224:4224"
    expose:
      - "4224"
    volumes:
      - dbx-data:/app/data
    restart: unless-stopped
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.dbx.rule=Host(`${DBX_DOMAIN:-dbx.localhost}`)
      - traefik.http.routers.dbx.entrypoints=web
      - traefik.http.routers.dbx.service=dbx
      - traefik.http.services.dbx.loadbalancer.server.port=4224
      - traefik.docker.network=${DOKPLOY_NETWORK:-dokploy-network}

volumes:
  dbx-data:

networks:
  dokploy-network:
    name: ${DOKPLOY_NETWORK:-dokploy-network}
    external: true
