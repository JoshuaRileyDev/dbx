services:
  dbx:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "4224:4224"
    expose:
      - "4224"
    environment:
      - DBX_PASSWORD=changeme
      # Native Streamable HTTP MCP is served by this same Web listener at /mcp.
      # Set the host authority clients use (including its externally mapped port).
      # - DBX_WEB_MCP_TOKEN=replace-with-a-long-random-secret
      # - DBX_WEB_MCP_ALLOWED_HOSTS=localhost:4224
      # Browser-based MCP clients additionally need their exact Origin, for example:
      # - DBX_WEB_MCP_ALLOWED_ORIGINS=https://mcp-client.example.com
      # Uncomment when publishing DBX under a reverse-proxy subpath, e.g. https://example.com/dbx/
      # - DBX_PUBLIC_BASE_PATH=/dbx
    volumes:
      - dbx-data:/app/data
    restart: unless-stopped
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.dbx.rule=Host(`${DBX_DOMAIN:-dbx.localhost}`)
      - traefik.http.routers.dbx.entrypoints=web
      - traefik.http.routers.dbx.service=dbx
      - traefik.http.services.dbx.loadbalancer.server.port=4224
      - traefik.docker.network=${DOKPLOY_NETWORK:-dokploy-network}

volumes:
  dbx-data:

networks:
  dokploy-network:
    name: ${DOKPLOY_NETWORK:-dokploy-network}
    external: true
